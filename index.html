<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu 3D Amélioré</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
    }
    button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <!-- Menu de démarrage -->
  <div id="menu">
    <h1>Jeu 3D Amélioré</h1>
    <button id="playBtn">Jouer</button>
  </div>
  <div id="score">Boules: 0</div>

  <!-- Inclusion de Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Variables globales
    let scene, camera, renderer;
    let player, playerSpeed = 0.1, runMultiplier = 2;
    let keys = {};
    let balls = [];         // Boules à ramasser
    let thrownBalls = [];   // Boules lancées
    let ballInventory = 0;  // Nombre de boules collectées
    let canJump = false, velocityY = 0;
    const gravity = -0.01;  // Gravité ajustée

    // Contrôle de la caméra par angles (coordonnées sphériques)
    let cameraAngleHorizontal = Math.PI; // Initialement derrière le joueur
    let cameraAngleVertical = 0.3;         // Légère élévation
    const cameraDistance = 5;              // Distance entre caméra et joueur

    // Initialisation de la scène
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      
      // Ajout de lumières pour un rendu plus réaliste
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
      directionalLight.position.set(5, 10, 7.5);
      scene.add(directionalLight);
      
      // Création d'un sol
      const planeGeometry = new THREE.PlaneGeometry(100, 100);
      const planeMaterial = new THREE.MeshLambertMaterial({ color: 0x008800, side: THREE.DoubleSide });
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.rotation.x = Math.PI / 2;
      scene.add(plane);
      
      // Création du joueur (cube bleu)
      const playerGeometry = new THREE.BoxGeometry(1, 1, 1);
      const playerMaterial = new THREE.MeshLambertMaterial({ color: 0x0000ff });
      player = new THREE.Mesh(playerGeometry, playerMaterial);
      player.position.y = 0.5;
      scene.add(player);
      
      // Ajout des mains au personnage (petits cubes dorés)
      const handGeometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
      const handMaterial = new THREE.MeshLambertMaterial({ color: 0xffd700 });
      const leftHand = new THREE.Mesh(handGeometry, handMaterial);
      leftHand.position.set(-0.6, 0.2, 0); // Positionnement par rapport au cube du joueur
      player.add(leftHand);
      const rightHand = new THREE.Mesh(handGeometry, handMaterial);
      rightHand.position.set(0.6, 0.2, 0);
      player.add(rightHand);
      
      // Création de quelques boules à ramasser (sphères rouges)
      const ballGeometry = new THREE.SphereGeometry(0.3, 16, 16);
      const ballMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });
      for (let i = 0; i < 10; i++) {
        const ball = new THREE.Mesh(ballGeometry, ballMaterial);
        ball.position.set((Math.random() - 0.5) * 20, 0.3, (Math.random() - 0.5) * 20);
        scene.add(ball);
        balls.push(ball);
      }
      
      // Gestion des événements clavier
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      window.addEventListener('resize', onWindowResize);
      
      animate();
    }
    
    // Gestion du redimensionnement de la fenêtre
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Gestion des pressions sur les touches
    function onKeyDown(event) {
      keys[event.key.toLowerCase()] = true;
      // Lancer une boule avec la touche "L"
      if (event.key.toLowerCase() === 'l') {
        lancerBoule();
      }
    }
    
    function onKeyUp(event) {
      keys[event.key.toLowerCase()] = false;
    }
    
    // Fonction pour lancer une boule collectée
    function lancerBoule() {
      if (ballInventory > 0) {
        const ballGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        const ballMaterial = new THREE.MeshLambertMaterial({ color: 0xffff00 });
        const thrownBall = new THREE.Mesh(ballGeometry, ballMaterial);
        thrownBall.position.copy(player.position);
        scene.add(thrownBall);
        // Définir la direction de lancement basée sur l'orientation horizontale de la caméra
        const direction = new THREE.Vector3(
          Math.sin(cameraAngleHorizontal),
          0.1, // légère inclinaison verticale
          Math.cos(cameraAngleHorizontal)
        ).normalize();
        thrownBall.userData = { velocity: direction.multiplyScalar(0.3) };
        thrownBalls.push(thrownBall);
        
        ballInventory--;
        document.getElementById('score').innerText = "Boules: " + ballInventory;
      }
    }
    
    // Mise à jour de la position de la caméra en fonction des angles et de la position du joueur
    function updateCamera() {
      const offset = new THREE.Vector3();
      offset.x = cameraDistance * Math.cos(cameraAngleVertical) * Math.sin(cameraAngleHorizontal);
      offset.y = cameraDistance * Math.sin(cameraAngleVertical);
      offset.z = cameraDistance * Math.cos(cameraAngleVertical) * Math.cos(cameraAngleHorizontal);
      camera.position.copy(player.position).add(offset);
      camera.lookAt(player.position);
    }
    
    // Boucle d'animation principale
    function animate() {
      requestAnimationFrame(animate);
      
      // Vitesse de déplacement (course si Shift est enfoncé)
      let moveSpeed = playerSpeed;
      if (keys['shift']) moveSpeed *= runMultiplier;
      
      // Calcul de la direction de déplacement relative à la caméra (sur le plan XZ)
      let forward = new THREE.Vector3(Math.sin(cameraAngleHorizontal), 0, Math.cos(cameraAngleHorizontal)).normalize();
      let right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      
      if (keys['z']) { // avancer
        player.position.add(forward.clone().multiplyScalar(moveSpeed));
      }
      if (keys['s']) { // reculer
        player.position.add(forward.clone().multiplyScalar(-moveSpeed));
      }
      if (keys['q']) { // gauche (strafe)
        player.position.add(right.clone().multiplyScalar(-moveSpeed));
      }
      if (keys['d']) { // droite (strafe)
        player.position.add(right.clone().multiplyScalar(moveSpeed));
      }
      
      // Gestion du saut
      if (keys[' '] && canJump) {
        velocityY = 0.15;
        canJump = false;
      }
      velocityY += gravity;
      player.position.y += velocityY;
      if (player.position.y <= 0.5) {
        player.position.y = 0.5;
        canJump = true;
        velocityY = 0;
      }
      
      // Mise à jour des angles de la caméra avec les flèches directionnelles
      if (keys['arrowleft']) {
        cameraAngleHorizontal += 0.03;
      }
      if (keys['arrowright']) {
        cameraAngleHorizontal -= 0.03;
      }
      if (keys['arrowup']) {
        cameraAngleVertical += 0.03;
      }
      if (keys['arrowdown']) {
        cameraAngleVertical -= 0.03;
      }
      // Limiter l'angle vertical pour éviter que la caméra ne se retourne
      cameraAngleVertical = Math.min(Math.PI / 2 - 0.1, Math.max(0.1, cameraAngleVertical));
      
      updateCamera();
      
      // Vérification de la collecte des boules
      for (let i = balls.length - 1; i >= 0; i--) {
        const ball = balls[i];
        if (player.position.distanceTo(ball.position) < 1) {
          scene.remove(ball);
          balls.splice(i, 1);
          ballInventory++;
          document.getElementById('score').innerText = "Boules: " + ballInventory;
        }
      }
      
      // Animation des boules lancées
      thrownBalls.forEach(tb => {
        tb.position.add(tb.userData.velocity);
        tb.userData.velocity.y += gravity;
        if (tb.position.y <= 0.3) {
          tb.position.y = 0.3;
          tb.userData.velocity.set(0, 0, 0);
        }
      });
      
      renderer.render(scene, camera);
    }
    
    // Démarrer le jeu au clic sur "Jouer"
    document.getElementById('playBtn').addEventListener('click', () => {
      document.getElementById('menu').style.display = 'none';
      init();
    });
  </script>
</body>
</html>
