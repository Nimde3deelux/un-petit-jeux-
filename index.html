<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu 3D</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 10;
    }
    button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 20px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <!-- Menu de démarrage -->
  <div id="menu">
    <h1>Jeu 3D</h1>
    <button id="playBtn">Jouer</button>
  </div>
  <div id="score">Boule : 0</div>
  
  <!-- Inclusion de Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Variables globales
    let scene, camera, renderer;
    let player, playerSpeed = 0.1, runMultiplier = 2;
    let keys = {};
    let balls = [];         // Boules à ramasser
    let thrownBalls = [];   // Boules lancées
    let ballInventory = 0;  // Nombre de boules collectées
    let canJump = false, velocityY = 0;
    const gravity = -0.005;

    // Initialisation de la scène
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      
      // Création d'un sol
      const planeGeometry = new THREE.PlaneGeometry(100, 100);
      const planeMaterial = new THREE.MeshBasicMaterial({ color: 0x008800, side: THREE.DoubleSide });
      const plane = new THREE.Mesh(planeGeometry, planeMaterial);
      plane.rotation.x = Math.PI / 2;
      scene.add(plane);
      
      // Création du joueur (cube bleu)
      const playerGeometry = new THREE.BoxGeometry(1, 1, 1);
      const playerMaterial = new THREE.MeshBasicMaterial({ color: 0x0000ff });
      player = new THREE.Mesh(playerGeometry, playerMaterial);
      player.position.y = 0.5;
      scene.add(player);
      
      // Position initiale de la caméra derrière le joueur
      camera.position.set(0, 2, -5);
      camera.lookAt(player.position);
      
      // Création de quelques boules (sphères rouges) à ramasser
      const ballGeometry = new THREE.SphereGeometry(0.3, 16, 16);
      const ballMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      for (let i = 0; i < 10; i++) {
        const ball = new THREE.Mesh(ballGeometry, ballMaterial);
        ball.position.set((Math.random()-0.5)*20, 0.3, (Math.random()-0.5)*20);
        scene.add(ball);
        balls.push(ball);
      }
      
      // Ecouteurs d'événements pour les touches
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      window.addEventListener('resize', onWindowResize);
      
      animate();
    }
    
    // Gestion du redimensionnement de la fenêtre
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    // Gestion des pressions sur les touches
    function onKeyDown(event) {
      keys[event.key.toLowerCase()] = true;
      
      // Lancer une boule avec la touche "L"
      if (event.key.toLowerCase() === 'l') {
        lancerBoule();
      }
    }
    
    function onKeyUp(event) {
      keys[event.key.toLowerCase()] = false;
    }
    
    // Fonction pour lancer une boule collectée
    function lancerBoule() {
      if (ballInventory > 0) {
        // Créer une nouvelle boule lancée (couleur jaune)
        const ballGeometry = new THREE.SphereGeometry(0.3, 16, 16);
        const ballMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const thrownBall = new THREE.Mesh(ballGeometry, ballMaterial);
        thrownBall.position.copy(player.position);
        scene.add(thrownBall);
        
        // Définir une vélocité initiale en fonction de la direction de la caméra
        const direction = new THREE.Vector3();
        camera.getWorldDirection(direction);
        thrownBall.userData = { velocity: direction.multiplyScalar(0.2) };
        thrownBalls.push(thrownBall);
        
        ballInventory--;
        document.getElementById('score').innerText = "Boule : " + ballInventory;
      }
    }
    
    // Boucle d'animation principale
    function animate() {
      requestAnimationFrame(animate);
      
      // Gestion du déplacement du joueur
      let moveSpeed = playerSpeed;
      if (keys['shift']) moveSpeed *= runMultiplier;
      
      let moveX = 0, moveZ = 0;
      if (keys['z']) moveZ -= moveSpeed;  // avancer
      if (keys['s']) moveZ += moveSpeed;  // reculer
      if (keys['q']) moveX -= moveSpeed;  // gauche
      if (keys['d']) moveX += moveSpeed;  // droite
      
      // Mise à jour de la position du joueur
      player.position.x += moveX;
      player.position.z += moveZ;
      
      // Gestion du saut
      if (keys[' ']) {
        if (canJump) {
          velocityY = 0.15;
          canJump = false;
        }
      }
      
      // Application de la gravité
      velocityY += gravity;
      player.position.y += velocityY;
      if (player.position.y <= 0.5) {
        player.position.y = 0.5;
        canJump = true;
        velocityY = 0;
      }
      
      // Contrôle de la caméra avec les flèches directionnelles
      if (keys['arrowleft']) {
        camera.rotation.y += 0.02;
      }
      if (keys['arrowright']) {
        camera.rotation.y -= 0.02;
      }
      if (keys['arrowup']) {
        camera.rotation.x += 0.02;
      }
      if (keys['arrowdown']) {
        camera.rotation.x -= 0.02;
      }
      
      // Faire suivre la caméra au joueur
      const cameraOffset = new THREE.Vector3(0, 2, -5);
      const cameraPosition = player.position.clone().add(cameraOffset.applyEuler(camera.rotation));
      camera.position.lerp(cameraPosition, 0.1);
      camera.lookAt(player.position);
      
      // Vérification de la collecte des boules
      for (let i = balls.length - 1; i >= 0; i--) {
        const ball = balls[i];
        if (player.position.distanceTo(ball.position) < 1) {
          scene.remove(ball);
          balls.splice(i, 1);
          ballInventory++;
          document.getElementById('score').innerText = "Boule : " + ballInventory;
        }
      }
      
      // Animation des boules lancées
      thrownBalls.forEach(tb => {
        // Déplacement de la boule selon sa vélocité
        tb.position.add(tb.userData.velocity);
        // Application de la gravité
        tb.userData.velocity.y += gravity;
        // Si la boule touche le sol, on la remet à niveau
        if (tb.position.y <= 0.3) {
          tb.position.y = 0.3;
          tb.userData.velocity.set(0, 0, 0);
        }
      });
      
      renderer.render(scene, camera);
    }
    
    // Lancement du jeu au clic sur "Jouer"
    document.getElementById('playBtn').addEventListener('click', () => {
      document.getElementById('menu').style.display = 'none';
      init();
    });
  </script>
</body>
</html>
