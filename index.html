<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu de plateforme 2D - Ennemis et Attaques</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
      font-family: sans-serif;
    }
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #menu button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 20px;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 20px;
      z-index: 5;
    }
    canvas {
      display: block;
      background: #444;
    }
  </style>
</head>
<body>
  <!-- Menu de démarrage -->
  <div id="menu">
    <h1>Jeu de plateforme 2D</h1>
    <p>Ramassez des boules, éliminez les ennemis, et terminez le niveau en entrant dans la maison !</p>
    <button id="playBtn">Jouer</button>
  </div>
  <!-- Score affiché en overlay -->
  <div id="score">Score: 0</div>
  <!-- Canvas en résolution par défaut -->
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  
  <script>
    // Récupération du canvas et du contexte
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const levelWidth = 2000;
    const levelHeight = canvas.height; // 400

    // Variables de contrôle clavier
    const keys = {};

    // Chargement des images du joueur depuis le dossier "images"
    const playerStaticImg = new Image();
    playerStaticImg.src = "images/perso.png";
    const playerMovingImg = new Image();
    playerMovingImg.src = "images/perso.gif";
    const playerTransfoImg = new Image();
    playerTransfoImg.src = "images/transfo.gif";

    // Chargement des images ennemies
    const enemyImages = [];
    for (let i = 1; i <= 4; i++) {
      let img = new Image();
      img.src = "images/enemie" + i + ".png";
      enemyImages.push(img);
    }

    // Définition du joueur
    const player = {
      x: 100,
      y: 300, // Sur le sol : le sol est à y = 350 et la hauteur du joueur est 50
      width: 40,
      height: 50,
      vx: 0,
      vy: 0,
      speed: 3,
      jumpStrength: 12,
      onGround: false,
      facing: "right", // Direction par défaut
      transformed: false,
      attacking: false
    };

    // Gravité
    const gravity = 0.5;

    // Plateformes (le sol et quelques plateformes intermédiaires)
    const platforms = [
      { x: 0, y: 350, width: levelWidth, height: 50 },  // sol
      { x: 300, y: 280, width: 150, height: 10 },
      { x: 700, y: 250, width: 150, height: 10 },
      { x: 1200, y: 300, width: 150, height: 10 }
    ];

    // Boules à collecter
    const balls = [];
    for (let i = 0; i < 10; i++) {
      const ball = {
        x: 150 + Math.random() * (levelWidth - 300),
        y: 0,
        radius: 10,
        collected: false
      };
      ball.y = 340; // Par défaut, sur le sol (350 - 10)
      platforms.forEach(p => {
        if (ball.x > p.x && ball.x < p.x + p.width && p.y < ball.y) {
          ball.y = p.y - ball.radius - 2;
        }
      });
      balls.push(ball);
    }

    // Maison (objectif du niveau)
    const house = {
      x: levelWidth - 150,
      y: 250,
      width: 100,
      height: 100
    };

    // Ennemis (4 ennemis avec images et patrouille)
    const enemies = [];
    enemies.push({
      x: 500,
      y: 350 - 40, // Sur le sol
      width: 40,
      height: 40,
      vx: 1,
      minX: 500,
      maxX: 700,
      image: enemyImages[0]
    });
    enemies.push({
      x: 1000,
      y: 350 - 40,
      width: 40,
      height: 40,
      vx: 1,
      minX: 900,
      maxX: 1100,
      image: enemyImages[1]
    });
    enemies.push({
      x: 320,
      y: 280 - 40,  // Sur la plateforme à x=300, y=280
      width: 40,
      height: 40,
      vx: 1,
      minX: 300,
      maxX: 450,
      image: enemyImages[2]
    });
    enemies.push({
      x: 1600,
      y: 350 - 40,
      width: 40,
      height: 40,
      vx: 1,
      minX: 1550,
      maxX: 1700,
      image: enemyImages[3]
    });

    // Tableau des attaques (projectiles tirés)
    const attacks = [];

    // Décalage de la caméra pour le défilement horizontal
    let cameraOffsetX = 0;

    // Variables de score et fin de niveau
    let score = 0;
    let levelFinished = false;

    // Gestion des événements clavier
    document.addEventListener("keydown", (e) => {
      keys[e.key] = true;

      // Attaque avec la touche K
      if (e.key.toLowerCase() === "k" && !player.attacking) {
        player.attacking = true;
        // Le joueur s'arrête
        player.vx = 0;
        // Création d'un projectile d'attaque (boule jaune)
        const attack = {
          x: player.x + player.width / 2,
          y: player.y + player.height / 2,
          radius: 10,
          vx: (player.facing === "left" ? -5 : 5)
        };
        attacks.push(attack);
        // Fin de l'attaque après 300ms
        setTimeout(() => { player.attacking = false; }, 300);
      }

      // Transformation avec la touche I
      if (e.key.toLowerCase() === "i" && !player.transformed) {
        player.transformed = true;
        // Pendant 3 secondes, le joueur affichera transfo.gif
        setTimeout(() => { player.transformed = false; }, 3000);
      }
    });
    document.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    // Boucle de mise à jour du jeu
    function update() {
      if (levelFinished) return;

      // Gestion du mouvement horizontal
      if (keys["ArrowLeft"]) {
        player.vx = -player.speed;
        player.facing = "left";
      } else if (keys["ArrowRight"]) {
        player.vx = player.speed;
        player.facing = "right";
      } else {
        if (!player.attacking) { // si pas en attaque, on arrête le mouvement
          player.vx = 0;
        }
      }

      // Saut avec la barre d'espace
      if (keys[" "] && player.onGround) {
        player.vy = -player.jumpStrength;
        player.onGround = false;
      }

      // Application de la gravité
      player.vy += gravity;

      // Mise à jour de la position du joueur
      player.x += player.vx;
      player.y += player.vy;

      // Collision avec les plateformes
      player.onGround = false;
      platforms.forEach(platform => {
        if (
          player.x < platform.x + platform.width &&
          player.x + player.width > platform.x &&
          player.y + player.height > platform.y &&
          player.y + player.height - player.vy <= platform.y
        ) {
          player.y = platform.y - player.height;
          player.vy = 0;
          player.onGround = true;
        }
      });

      // Empêcher le joueur de tomber en dessous du niveau
      if (player.y + player.height > levelHeight) {
        player.y = levelHeight - player.height;
        player.vy = 0;
        player.onGround = true;
      }

      // Mise à jour des projectiles d'attaque
      for (let i = attacks.length - 1; i >= 0; i--) {
        const attack = attacks[i];
        attack.x += attack.vx;
        // Suppression si le projectile sort des limites du niveau
        if (attack.x < 0 || attack.x > levelWidth) {
          attacks.splice(i, 1);
        }
      }

      // Collision entre attaque et ennemis
      for (let i = attacks.length - 1; i >= 0; i--) {
        const attack = attacks[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (
            attack.x > enemy.x &&
            attack.x < enemy.x + enemy.width &&
            attack.y > enemy.y &&
            attack.y < enemy.y + enemy.height
          ) {
            // L'ennemi est éliminé et le projectile disparaît
            enemies.splice(j, 1);
            attacks.splice(i, 1);
            score++;
            document.getElementById("score").innerText = "Score: " + score;
            break;
          }
        }
      }

      // Mise à jour du mouvement des ennemis (patrouille)
      enemies.forEach(enemy => {
        enemy.x += enemy.vx;
        if (enemy.x < enemy.minX || enemy.x > enemy.maxX) {
          enemy.vx = -enemy.vx;
        }
      });

      // Collecte des boules
      balls.forEach(ball => {
        if (!ball.collected) {
          const dx = (player.x + player.width / 2) - ball.x;
          const dy = (player.y + player.height / 2) - ball.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < ball.radius + Math.min(player.width, player.height) / 2) {
            ball.collected = true;
            score++;
            document.getElementById("score").innerText = "Score: " + score;
          }
        }
      });

      // Vérification si le joueur atteint la maison (fin du niveau)
      if (
        player.x < house.x + house.width &&
        player.x + player.width > house.x &&
        player.y < house.y + house.height &&
        player.y + player.height > house.y
      ) {
        levelFinished = true;
      }

      // Mise à jour du décalage de la caméra pour suivre le joueur
      cameraOffsetX = Math.min(Math.max(player.x - canvas.width / 2, 0), levelWidth - canvas.width);

      draw();
      requestAnimationFrame(update);
    }

    // Fonction de dessin
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(-cameraOffsetX, 0);

      // Dessiner le fond (sol)
      ctx.fillStyle = "#555";
      ctx.fillRect(0, platforms[0].y, levelWidth, platforms[0].height);

      // Dessiner les autres plateformes
      ctx.fillStyle = "#777";
      platforms.slice(1).forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
      });

      // Dessiner les boules
      balls.forEach(ball => {
        if (!ball.collected) {
          ctx.fillStyle = "#ff0";
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Dessiner la maison
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(house.x, house.y, house.width, house.height);
      ctx.fillStyle = "#000";
      ctx.fillRect(house.x + house.width / 2 - 10, house.y + house.height - 40, 20, 40);

      // Dessiner les ennemis
      enemies.forEach(enemy => {
        ctx.drawImage(enemy.image, enemy.x, enemy.y, enemy.width, enemy.height);
      });

      // Dessiner les projectiles d'attaque
      attacks.forEach(attack => {
        ctx.fillStyle = "#ff0";
        ctx.beginPath();
        ctx.arc(attack.x, attack.y, attack.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Choix de l'image du joueur
      let playerImg;
      if (player.transformed) {
        playerImg = playerTransfoImg;
      } else if (player.attacking) {
        // Lors de l'attaque, on peut afficher l'image statique
        playerImg = playerStaticImg;
      } else if (keys["ArrowLeft"] || keys["ArrowRight"]) {
        playerImg = playerMovingImg;
      } else {
        playerImg = playerStaticImg;
      }
      ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

      ctx.restore();

      // Message de fin de niveau
      if (levelFinished) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "40px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Niveau terminé !", canvas.width / 2, canvas.height / 2);
      }
    }

    // Démarrage du jeu au clic sur "Jouer"
    document.getElementById("playBtn").addEventListener("click", () => {
      document.getElementById("menu").style.display = "none";
      score = 0;
      document.getElementById("score").innerText = "Score: 0";
      levelFinished = false;
      // Réinitialisation de la position et des états du joueur
      player.x = 100;
      player.y = 300;
      player.vx = 0;
      player.vy = 0;
      player.transformed = false;
      player.attacking = false;
      // Remise à zéro de la collecte des boules
      balls.forEach(ball => ball.collected = false);
      // Réinitialisation des positions des ennemis
      enemies[0].x = 500;
      enemies[1].x = 1000;
      enemies[2].x = 320;
      enemies[3].x = 1600;
      // Suppression des attaques en cours
      attacks.length = 0;
      update();
    });
  </script>
</body>
</html>
