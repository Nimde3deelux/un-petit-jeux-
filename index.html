<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu de plateforme 2D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
      font-family: sans-serif;
    }
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #menu button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 20px;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 20px;
      z-index: 5;
    }
    canvas {
      display: block;
      background: #444;
    }
  </style>
</head>
<body>
  <!-- Menu de démarrage -->
  <div id="menu">
    <h1>Jeu de plateforme 2D</h1>
    <p>Ramassez des boules et terminez le niveau en entrant dans la maison !</p>
    <button id="playBtn">Jouer</button>
  </div>
  <!-- Score affiché en overlay -->
  <div id="score">Score: 0</div>
  <!-- Zone de jeu -->
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  
  <script>
    // Récupération du canvas et du contexte
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Dimensions du niveau
    const levelWidth = 2000;
    const levelHeight = canvas.height;

    // Variables de contrôle clavier
    const keys = {};

    // Définition du joueur
    const player = {
      x: 100,
      y: 300,
      width: 40,
      height: 50,
      vx: 0,
      vy: 0,
      speed: 3,
      jumpStrength: 12,
      onGround: false
    };

    // Gravité (accélération verticale)
    const gravity = 0.5;

    // Plateformes : ici une grande plateforme au sol, vous pouvez ajouter d'autres plateformes
    const platforms = [
      { x: 0, y: 350, width: levelWidth, height: 50 },
      // Exemple d'une plateforme intermédiaire
      { x: 300, y: 280, width: 150, height: 10 },
      { x: 700, y: 250, width: 150, height: 10 },
      { x: 1200, y: 300, width: 150, height: 10 }
    ];

    // Boules à collecter (positionnées sur le niveau)
    const balls = [];
    for (let i = 0; i < 10; i++) {
      // Réparties aléatoirement sur le sol ou sur une plateforme
      const ball = {
        x: 150 + Math.random() * (levelWidth - 300),
        y: 0, // nous placerons la boule sur la plateforme la plus proche
        radius: 10,
        collected: false
      };
      // On fixe la hauteur de la boule en fonction du sol ou d'une plateforme
      ball.y = 340; // par défaut sur le sol
      // Si la boule tombe sur une plateforme intermédiaire, on l'ajuste (exemple simple)
      platforms.forEach(p => {
        if (ball.x > p.x && ball.x < p.x + p.width && p.y < ball.y) {
          ball.y = p.y - ball.radius - 2;
        }
      });
      balls.push(ball);
    }

    // Maison (objectif du niveau) située à la fin
    const house = {
      x: levelWidth - 150,
      y: 250,
      width: 100,
      height: 100
    };

    // Variable de score et état de fin de niveau
    let score = 0;
    let levelFinished = false;

    // Position de la caméra (décalage en x)
    let cameraOffsetX = 0;

    // Gestion des événements clavier
    document.addEventListener("keydown", (e) => {
      keys[e.key] = true;
    });
    document.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    // Boucle de mise à jour du jeu
    function update() {
      if (levelFinished) return; // Stoppe la boucle si le niveau est terminé

      // Contrôle horizontal
      if (keys["ArrowLeft"]) {
        player.vx = -player.speed;
      } else if (keys["ArrowRight"]) {
        player.vx = player.speed;
      } else {
        player.vx = 0;
      }

      // Saut (barre d'espace)
      if (keys[" "] && player.onGround) {
        player.vy = -player.jumpStrength;
        player.onGround = false;
      }

      // Application de la gravité
      player.vy += gravity;

      // Mise à jour des positions
      player.x += player.vx;
      player.y += player.vy;

      // Collision avec les plateformes
      player.onGround = false;
      platforms.forEach(platform => {
        // Vérification simple d'intersection (collision par le bas)
        if (
          player.x < platform.x + platform.width &&
          player.x + player.width > platform.x &&
          player.y + player.height > platform.y &&
          player.y + player.height - player.vy <= platform.y
        ) {
          player.y = platform.y - player.height;
          player.vy = 0;
          player.onGround = true;
        }
      });

      // Empêcher le joueur de tomber sous le niveau
      if (player.y + player.height > levelHeight) {
        player.y = levelHeight - player.height;
        player.vy = 0;
        player.onGround = true;
      }

      // Collecte des boules
      balls.forEach(ball => {
        if (!ball.collected) {
          // Détection de collision simple (distance entre centres)
          const dx = (player.x + player.width / 2) - ball.x;
          const dy = (player.y + player.height / 2) - ball.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < ball.radius + Math.min(player.width, player.height) / 2) {
            ball.collected = true;
            score++;
            document.getElementById("score").innerText = "Score: " + score;
          }
        }
      });

      // Vérification si le joueur entre dans la maison (collision rectangle)
      if (
        player.x < house.x + house.width &&
        player.x + player.width > house.x &&
        player.y < house.y + house.height &&
        player.y + player.height > house.y
      ) {
        levelFinished = true;
      }

      // Mise à jour du décalage de la caméra pour suivre le joueur
      cameraOffsetX = Math.min(Math.max(player.x - canvas.width / 2, 0), levelWidth - canvas.width);

      draw();
      requestAnimationFrame(update);
    }

    // Fonction de dessin
    function draw() {
      // Effacer le canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sauvegarder le contexte et décaler pour la caméra
      ctx.save();
      ctx.translate(-cameraOffsetX, 0);

      // Dessiner le fond du niveau (sol)
      ctx.fillStyle = "#555";
      ctx.fillRect(0, 350, levelWidth, 50);

      // Dessiner les plateformes
      ctx.fillStyle = "#777";
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
      });

      // Dessiner les boules
      balls.forEach(ball => {
        if (!ball.collected) {
          ctx.fillStyle = "#ff0";
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Dessiner la maison (objectif)
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(house.x, house.y, house.width, house.height);
      // Dessiner la porte
      ctx.fillStyle = "#000";
      ctx.fillRect(house.x + house.width / 2 - 10, house.y + house.height - 40, 20, 40);

      // Dessiner le joueur
      ctx.fillStyle = "#00f";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.restore();

      // Si le niveau est terminé, afficher un message
      if (levelFinished) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.font = "40px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Niveau terminé !", canvas.width / 2, canvas.height / 2);
      }
    }

    // Démarrage du jeu au clic sur "Jouer"
    document.getElementById("playBtn").addEventListener("click", () => {
      document.getElementById("menu").style.display = "none";
      // Réinitialiser les variables si besoin
      score = 0;
      document.getElementById("score").innerText = "Score: 0";
      levelFinished = false;
      // Position de départ du joueur
      player.x = 100;
      player.y = 300;
      player.vx = 0;
      player.vy = 0;
      // Remettre toutes les boules non ramassées
      balls.forEach(ball => ball.collected = false);
      update();
    });
  </script>
</body>
</html>
