<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu de plateforme 2D - Ennemis, Attaques et Transformation</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
      font-family: sans-serif;
    }
    #menu {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #menu button {
      padding: 10px 20px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 20px;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 20px;
      z-index: 5;
    }
    canvas {
      display: block;
      background: #444;
    }
  </style>
</head>
<body>
  <!-- Menu de démarrage -->
  <div id="menu">
    <h1>Jeu de plateforme 2D</h1>
    <p>Ramassez des boules, éliminez les ennemis et terminez le niveau en entrant dans la maison !</p>
    <button id="playBtn">Jouer</button>
  </div>
  <!-- Score affiché en overlay -->
  <div id="score">Score: 0</div>
  <!-- Canvas en résolution par défaut -->
  <canvas id="gameCanvas" width="800" height="400"></canvas>
  
  <script>
    // Récupération du canvas et du contexte
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const levelWidth = 2000;
    const levelHeight = canvas.height; // 400

    // Variables de contrôle clavier
    const keys = {};

    // Chargement des images du joueur depuis le dossier "images"
    const playerStaticImg = new Image();
    playerStaticImg.src = "images/perso.png";
    const playerMovingImg = new Image();
    playerMovingImg.src = "images/perso.gif";
    const playerTransfoImg = new Image();
    playerTransfoImg.src = "images/transfo.gif";

    // Chargement des images ennemies
    const enemyImages = [];
    for (let i = 1; i <= 4; i++) {
      const img = new Image();
      img.src = "images/enemie" + i + ".png";
      enemyImages.push(img);
    }

    // Définition du joueur
    const player = {
      x: 100,
      y: 300, // Le joueur est placé de sorte que son bas (y + 50) coïncide avec le sol à y = 350.
      width: 40,
      height: 50,
      vx: 0,
      vy: 0,
      speed: 3,
      jumpStrength: 12,
      onGround: false,
      facing: "right", // Direction par défaut
      transformed: false,
      attacking: false
    };

    // Gravité
    const gravity = 0.5;

    // Plateformes : le sol et quelques plateformes intermédiaires
    const platforms = [
      { x: 0, y: 350, width: levelWidth, height: 50 },  // sol
      { x: 300, y: 280, width: 150, height: 10 },
      { x: 700, y: 250, width: 150, height: 10 },
      { x: 1200, y: 300, width: 150, height: 10 }
    ];

    // Boules à collecter
    const balls = [];
    for (let i = 0; i < 10; i++) {
      const ball = {
        x: 150 + Math.random() * (levelWidth - 300),
        y: 0,
        radius: 10,
        collected: false
      };
      // Par défaut, placer la boule sur le sol
      ball.y = 340; // 350 (sol) - 10
      // Ajustement si la boule est sur une plateforme
      platforms.forEach(p => {
        if (ball.x > p.x && ball.x < p.x + p.width && p.y < ball.y) {
          ball.y = p.y - ball.radius - 2;
        }
      });
      balls.push(ball);
    }

    // Maison (objectif du niveau)
    const house = {
      x: levelWidth - 150,
      y: 250,
      width: 100,
      height: 100
    };

    // Ennemis : Limiter à 2 ennemis maximum
    const enemies = [
      {
        x: 500,
        y: 350 - 40, // sur le sol
        width: 40,
        height: 40,
        vx: 1,
        minX: 500,
        maxX: 700,
        image: enemyImages[0]
      },
      {
        x: 1000,
        y: 350 - 40,
        width: 40,
        height: 40,
        vx: 1,
        minX: 900,
        maxX: 1100,
        image: enemyImages[1]
      }
    ];

    // Tableau des attaques (projectiles tirés)
    const attacks = [];

    // Décalage de la caméra pour le défilement horizontal
    let cameraOffsetX = 0;

    // Variables de score et fin de niveau
    let score = 0;
    let levelFinished = false;

    // Gestion des événements clavier
    document.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      
      // Attaque avec la touche K
      if (e.key.toLowerCase() === "k" && !player.attacking) {
        player.attacking = true;
        // Arrêt immédiat du mouvement pendant l'attaque
        player.vx = 0;
        // Création d'un projectile d'attaque (boule jaune)
        const attack = {
          x: player.x + player.width / 2,
          y: player.y + player.height / 2,
          radius: 10,
          vx: (player.facing === "left" ? -5 : 5)
        };
        attacks.push(attack);
        // Fin de l'attaque après 300 ms
        setTimeout(() => { player.attacking = false; }, 300);
      }
      
      // Transformation avec la touche I
      if (e.key.toLowerCase() === "i" && !player.transformed) {
        player.transformed = true;
        setTimeout(() => { player.transformed = false; }, 3000);
      }
    });
    
    document.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    // Boucle de mise à jour
    function update() {
      if (levelFinished) return;

      // Mouvement horizontal
      if (keys["ArrowLeft"]) {
        player.vx = -player.speed;
        player.facing = "left";
      } else if (keys["ArrowRight"]) {
        player.vx = player.speed;
        player.facing = "right";
      } else {
        if (!player.attacking) {
          player.vx = 0;
        }
      }

      // Saut (barre d'espace)
      if (keys[" "] && player.onGround) {
        player.vy = -player.jumpStrength;
        player.onGround = false;
      }

      // Application de la gravité
      player.vy += gravity;

      // Mise à jour des positions du joueur
      player.x += player.vx;
      player.y += player.vy;

      // Collision avec les plateformes
      player.onGround = false;
      platforms.forEach(platform => {
        if (
          player.x < platform.x + platform.width &&
          player.x + player.width > platform.x &&
          player.y + player.height > platform.y &&
          player.y + player.height - player.vy <= platform.y
        ) {
          player.y = platform.y - player.height;
          player.vy = 0;
          player.onGround = true;
        }
      });

      // Empêcher le joueur de tomber en dessous du niveau
      if (player.y + player.height > levelHeight) {
        player.y = levelHeight - player.height;
        player.vy = 0;
        player.onGround = true;
      }

      // Mise à jour des projectiles d'attaque
      for (let i = 0; i < attacks.length; i++) {
        const attack = attacks[i];
        attack.x += attack.vx;

        // Collision avec les ennemis
        enemies.forEach(enemy => {
          if (
            attack.x < enemy.x + enemy.width &&
            attack.x + attack.radius > enemy.x &&
            attack.y < enemy.y + enemy.height &&
            attack.y + attack.radius > enemy.y
          ) {
            score += 10;
            attacks.splice(i, 1);
            i--;
            enemy.x = -999; // Enlever l'ennemi frappé du jeu
          }
        });
      }

      // Limitation des ennemis à 2
      if (enemies.length > 2) {
        enemies.splice(2); // Garder seulement 2 ennemis
      }

      // Mise à jour des ennemis
      enemies.forEach(enemy => {
        enemy.x += enemy.vx;
        if (enemy.x <= enemy.minX || enemy.x >= enemy.maxX) {
          enemy.vx = -enemy.vx;
        }
      });

      // Détection de la fin du niveau
      if (player.x + player.width > house.x && player.x < house.x + house.width &&
          player.y + player.height > house.y) {
        levelFinished = true;
        alert("Vous avez terminé le niveau avec un score de " + score);
      }

      // Mise à jour du score
      document.getElementById("score").textContent = "Score: " + score;

      // Effacement et redessin
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      draw();
    }

    // Fonction de dessin
    function draw() {
      ctx.fillStyle = "#4CAF50";
      ctx.fillRect(player.x - cameraOffsetX, player.y, player.width, player.height);

      // Dessiner les projectiles
      ctx.fillStyle = "yellow";
      attacks.forEach(attack => {
        ctx.beginPath();
        ctx.arc(attack.x - cameraOffsetX, attack.y, attack.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Dessiner les ennemis
      enemies.forEach(enemy => {
        ctx.drawImage(enemy.image, enemy.x - cameraOffsetX, enemy.y, enemy.width, enemy.height);
      });

      // Dessiner les boules
      balls.forEach(ball => {
        if (!ball.collected) {
          ctx.beginPath();
          ctx.arc(ball.x - cameraOffsetX, ball.y, ball.radius, 0, Math.PI * 2);
          ctx.fillStyle = "yellow";
          ctx.fill();
        }
      });

      // Dessiner la maison
      ctx.fillStyle = "#8B4513";
      ctx.fillRect(house.x - cameraOffsetX, house.y, house.width, house.height);
    }

    // Fonction principale
    function gameLoop() {
      update();
      requestAnimationFrame(gameLoop);
    }

    // Démarrer le jeu lorsque le bouton est pressé
    document.getElementById("playBtn").addEventListener("click", () => {
      document.getElementById("menu").style.display = "none";
      gameLoop();
    });
  </script>
</body>
</html>
